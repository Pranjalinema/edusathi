
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSathi AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .chat-container {
            max-width: 750px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 18px #0001;
        }
        .chat-messages {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            white-space: pre-wrap;
        }
        .user-message {
            background: #e0efff;
            margin-left: 15%;
        }
        .ai-message {
            background: #f1f3f5;
            margin-right: 15%;
        }
        .chat-form {
            display: flex;
            gap: 10px;
        }
        .chat-form input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .chat-form button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        #status {
            color: #666;
            font-size: 14px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>EduSathi AI Study Assistant</h1>
        <p>Ask questions, understand concepts, and practise for your exams.</p>

        <div class="chat-messages" id="messages" aria-live="polite">
            <div class="message ai-message">
                Hi! I'm your EduSathi study assistant. What would you like to learn today?
            </div>
        </div>

        <p id="status"></p>

        <form class="chat-form" id="chat-form">
            <input id="question" type="text"
                   placeholder="Ask your study question..."
                   autocomplete="off" required>
            <button type="submit" id="send-button">Send</button>
        </form>

        <p><a href="/">← Back to Home</a></p>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("question");
        const messages = document.getElementById("messages");
        const status = document.getElementById("status");
        const sendButton = document.getElementById("send-button");

        function addMessage(text, className) {
            const message = document.createElement("div");
            message.className = "message " + className;
            message.textContent = text;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
            return message;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const question = input.value.trim();
            if (!question) return;

            addMessage(question, "user-message");
            input.value = "";
            sendButton.disabled = true;
            status.textContent = "EduSathi is thinking...";

            try {
                const response = await fetch("/ask-ai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();
                addMessage(
                    data.answer || "Sorry, I couldn't generate a response.",
                    "ai-message"
                );

                if (!response.ok) {
                    status.textContent = "Please try again in a moment.";
                } else {
                    status.textContent = "";
                }
            } catch (error) {
                addMessage(
                    "Couldn't connect to the server. Check that EduSathi is running.",
                    "ai-message"
                );
                status.textContent = "Connection error.";
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
